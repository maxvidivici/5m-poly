[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edge_bot"
version = "0.1.0"
description = "Polymarket BTC 5m Up/Down trading bot with composite confidence, risk management and hedge engine"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "edge-bot contributors"}]
dependencies = [
    "python-dotenv>=1.0.1",
    "httpx>=0.27",
    "websockets>=12.0",
    "numpy>=1.26",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "py-clob-client>=0.20.0",
]

[project.optional-dependencies]
dashboard = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[project.scripts]
edge-bot = "edge_bot.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = "none"
reportPrivateImportUsage = "none"
reportMissingImports = "none"
reportArgumentType = "none"
reportUnsupportedDunderAll = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
